
<div class="title-header">
  <h2 class="title ms-3" mat-dialog-title><mat-icon style="vertical-align: middle;">search</mat-icon> Buscar Producto</h2>
  <!-- <span style="float: right" [mat-dialog-close]>X</span> -->
  <button mat-icon-button class="close-button" (click)="close()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
  </button>
</div>
<div class="carded mt-3 mb-3">
    <div class="center">
        <div class="card">
          <div class="card-body">
                <div class="col-sm-4">

                  <mat-card-actions class="search-bar">
                      <mat-form-field floatLabel="always" appearance="outline" class="w-100">
                      <mat-label>Buscar producto</mat-label>
                      <mat-icon matPrefix>search</mat-icon>
                      <input matInput [(ngModel)]="searchString" type="text" placeholder="Buscar producto por nombre" (keyup)="filtrarProductos()">
                      @if (searchString){
                        <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearchInput()">
                          <!-- <mat-icon>close</mat-icon> -->
                           <mat-icon fontIcon="close"></mat-icon>
                        </button>
                      }
                      </mat-form-field>
                  </mat-card-actions>
                </div>


                <div class="table-responsive mb-3">
                  <ng-scrollbar >
                        <table mat-table [dataSource]="dataSource" matSort class="table table-sm table-hover">
  
                          <ng-container matColumnDef="codigo">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                              <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="nombre">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Producto</th>
                              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                          </ng-container>
          
                          <ng-container matColumnDef="stock">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock Disponible</th>
                              <td mat-cell *matCellDef="let element"> {{element.current_stock}} </td>
                          </ng-container>
  
                          <ng-container matColumnDef="cantidad">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header>Cantidad</th>
                              <td mat-cell *matCellDef="let element">
                                  <input matInput type="number" min="1" [(ngModel)]="element.quantity"
                                  (ngModelChange)="stockSuficiente(element)">
                              </td>
                          </ng-container>
          
                          <ng-container matColumnDef="precio">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
                              <td mat-cell *matCellDef="let element"> {{element.price1}} </td>
                          </ng-container>
          
                          <ng-container matColumnDef="acciones">
                              <th mat-header-cell *matHeaderCellDef>Añadir al carrito</th>
                              <td mat-cell *matCellDef="let element">
                                <button (click)="agregarProducto(element)" mat-icon-button>
                                  <mat-icon style="color: red;">add_shopping_cart</mat-icon>
                                </button>
                          </ng-container>
          
                            <tr mat-header-row *matHeaderRowDef="displayedColumns;"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                      </ng-scrollbar>
                    
                    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons [pageSize]="10"></mat-paginator>  
                </div>
                
          </div>
 

          </div>
    </div>
  </div>
