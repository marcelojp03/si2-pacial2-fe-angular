<div class="grid grid-cols-12 gap-8">
  <!-- Welcome Card -->
  <div class="col-span-12">
    <div class="card bg-gradient-to-r from-primary-500 to-primary-700 text-white mb-0">
      <div class="flex align-items-center justify-content-between">
        <div>
          <h1 class="text-4xl font-bold mb-2">¡Bienvenido al Sistema MRP!</h1>
          <p class="text-xl opacity-90 mb-3">
            Panel de control de tu organización
          </p>
          <p-tag *ngIf="subscription()?.plan" 
                 [value]="'Plan: ' + subscription()!.plan.name" 
                 severity="contrast"
                 styleClass="text-lg">
          </p-tag>
        </div>
        <i class="pi pi-chart-line text-8xl opacity-50"></i>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading()) {
    <div class="col-span-12">
      <div class="card text-center py-8">
        <p-progressSpinner styleClass="w-20 h-20" />
        <p class="mt-4 text-surface-600 dark:text-surface-300">
          Cargando estadísticas...
        </p>
      </div>
    </div>
  }

  <!-- Stats Cards Widget -->
  @if (!loading() && stats()) {
    <app-stats-widget class="contents" [stats]="stats()" />
  }

  <!-- Stock Alerts Widget -->
  @if (!loading()) {
    <div class="col-span-12">
      <app-stock-alerts-widget [alerts]="stockAlerts()" />
    </div>
  }
</div>

<p-toast />
