<div class="grid">
  <div class="col-12">
    <p-card header="Generador de Reportes con IA" subheader="Consulta tus datos con lenguaje natural">
      <div class="grid">
        <div class="col-12">
          <label for="query" class="block mb-2 font-semibold">Consulta</label>
          <textarea id="query" pTextarea [(ngModel)]="query" rows="4" class="w-full" [disabled]="isLoading" placeholder="Ejemplo: Muestra los 10 productos más vendidos este mes"></textarea>
        </div>
        <div class="col-12 md:col-6">
          <label for="format" class="block mb-2 font-semibold">Formato</label>
          <p-select id="format" [(ngModel)]="selectedFormat" [options]="formatOptions" optionLabel="label" optionValue="value" class="w-full" [disabled]="isLoading" />
        </div>
        <div class="col-12 md:col-6">
          <label for="template" class="block mb-2 font-semibold">Templates</label>
          <p-select id="template" [(ngModel)]="selectedTemplate" [options]="templateCategories" optionLabel="label" [group]="true" placeholder="Selecciona..." class="w-full" [disabled]="isLoading" (onChange)="onTemplateSelect()" />
        </div>
        <div class="col-12">
          <div class="flex gap-2 justify-content-end">
            <p-button label="Limpiar" icon="pi pi-times" severity="secondary" [disabled]="isLoading" (onClick)="clearForm()" />
            <p-button label="Generar" icon="pi pi-chart-bar" [loading]="isLoading" (onClick)="generateReport()" />
          </div>
        </div>
      </div>
      <p-divider />
      <div class="mb-3">
        <h3 class="text-lg font-semibold mb-2">Ejemplos</h3>
        <div class="flex flex-wrap gap-2">
          <p-chip *ngFor="let ex of quickExamples" [label]="ex" styleClass="cursor-pointer" (click)="applyExample(ex)" />
        </div>
      </div>
      <p-divider />
      <div *ngIf="isLoading" class="flex justify-content-center" style="min-height: 200px;">
        <p-progressSpinner />
      </div>
      <div *ngIf="hasResults && !isLoading">
        <div class="mb-3 grid">
          <div class="col-12 md:col-4">
            <div class="text-500">SQL</div>
            <div class="font-semibold text-sm">{{ reportData?.sql_query }}</div>
          </div>
          <div class="col-12 md:col-4">
            <div class="text-500">Tiempo</div>
            <div class="font-semibold">{{ reportData?.execution_time }}s</div>
          </div>
          <div class="col-12 md:col-4">
            <div class="text-500">Filas</div>
            <div class="font-semibold">{{ reportData?.data?.row_count }}</div>
          </div>
        </div>
        <p-card *ngIf="reportData?.interpretation" class="mb-3">
          <ng-template pTemplate="header">
            <div class="flex align-items-center gap-2 p-3">
              <i class="pi pi-info-circle"></i>
              <span class="font-semibold">Interpretación</span>
            </div>
          </ng-template>
          <p>{{ reportData?.interpretation }}</p>
        </p-card>
        <p-table [value]="rows" [scrollable]="true" scrollHeight="400px">
          <ng-template pTemplate="header">
            <tr>
              <th *ngFor="let col of columns">{{ col }}</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row>
            <tr>
              <td *ngFor="let col of columns">{{ row[col] }}</td>
            </tr>
          </ng-template>
        </p-table>
        <div class="flex justify-content-end mt-3">
          <p-button label="Descargar" icon="pi pi-download" (onClick)="downloadReport()" [loading]="isLoading" />
        </div>
      </div>
      <div *ngIf="reportData && !hasResults && !isLoading" class="text-center py-5">
        <i class="pi pi-info-circle text-4xl text-500 mb-3"></i>
        <p class="text-500">Sin resultados</p>
      </div>
    </p-card>
  </div>
</div>
<p-toast />
