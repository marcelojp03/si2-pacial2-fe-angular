<div class="min-h-screen bg-surface-0 dark:bg-surface-900 flex items-center justify-center px-4 py-8">
  <div class="max-w-lg w-full">
    <div class="surface-card border border-surface-200 dark:border-surface-700 rounded-xl overflow-hidden">
      <!-- Icono de éxito -->
      <div class="text-center py-8 bg-gradient-to-br from-green-50 to-primary-50 dark:from-green-900/10 dark:to-primary-900/10">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-100 dark:bg-green-900/30 mb-4">
          <i class="pi pi-check text-5xl text-green-600 dark:text-green-400"></i>
        </div>
        <h1 class="text-3xl font-bold text-surface-900 dark:text-surface-0">
          ¡Pedido Realizado!
        </h1>
      </div>

      <!-- Contenido -->
      <div class="p-6 text-center">
        <p class="text-lg text-surface-600 dark:text-surface-400 mb-6">
          Tu orden ha sido recibida y está siendo procesada.
        </p>

        <div class="bg-surface-50 dark:bg-surface-800 rounded-lg p-4 mb-6 text-left">
          <div class="flex items-start gap-3 text-sm text-surface-700 dark:text-surface-300">
            <i class="pi pi-envelope text-lg text-primary mt-0.5"></i>
            <p>Recibirás un correo de confirmación con los detalles de tu pedido.</p>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <p-button
            label="Ver mis pedidos"
            icon="pi pi-list"
            [outlined]="true"
            styleClass="w-full"
            (onClick)="goToOrders()"
          />
          <p-button
            label="Continuar comprando"
            icon="pi pi-shopping-bag"
            iconPos="right"
            styleClass="w-full"
            (onClick)="goToHome()"
          />
        </div>
      </div>

      <!-- Footer -->
      <div class="border-t border-surface-200 dark:border-surface-700 p-5 bg-surface-50 dark:bg-surface-800">
        <div class="flex items-start gap-3 text-sm text-surface-600 dark:text-surface-400">
          <i class="pi pi-info-circle text-lg text-primary mt-0.5"></i>
          <div>
            <p class="font-semibold mb-1">¿Necesitas ayuda?</p>
            <p>Contacta a nuestro equipo de soporte si tienes alguna pregunta.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
